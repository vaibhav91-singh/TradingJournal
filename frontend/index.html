<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  PRIMARY SEO                                               -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <title>Trader Journal – Best Free Trading Journal & Backtest Log App</title>

    <!--  STRUCTURED DATA – JSON-LD (Rich Results)                  -->
    <!-- ═══════════════════════════════════════════════════════════ -->

    <!-- SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Trader Journal",
      "applicationCategory": "FinanceApplication",
      "applicationSubCategory": "Trading Journal",
      "operatingSystem": "Web",
      "url": "https://traderjournal.app/",
      "description": "Trader Journal is a free, privacy-first trading journal and backtest log app. Log trades with chart screenshots, calculate Risk-to-Reward automatically, track outcomes, and review setups – all stored securely on your Google Drive.",
      "screenshot": "https://traderjournal.app/og-image.png",
      "featureList": [
        "Trade screenshot upload and storage",
        "Automatic Risk-to-Reward calculation",
        "PnL and Points tracking",
        "Trade duration calculator",
        "Revise and review mode",
        "Google Drive private storage",
        "Backtest journal log",
        "Outcome tracking (Target Hit, SL Hit, Manual)"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "128"
      },
      "author": {
        "@type": "Organization",
        "name": "Trader Journal"
      }
    }
    </script>

    <!-- WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Trader Journal",
      "url": "https://traderjournal.app/",
      "description": "The best free trading journal app with Google Drive storage, automatic R:R calculation, and beautiful 3D interface.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://traderjournal.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Trader Journal",
      "url": "https://traderjournal.app/",
      "logo": "https://traderjournal.app/favicon.svg",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

    <!-- FAQPage (for FAQ rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Trader Journal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trader Journal is a free, privacy-first web app that lets you log your stock, forex, and crypto trades with chart screenshots, automatically calculate Risk-to-Reward and PnL, and store everything securely in your own Google Drive."
          }
        },
        {
          "@type": "Question",
          "name": "Is Trader Journal free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Trader Journal is completely free. Just sign in with your Google account and start journaling your trades instantly."
          }
        },
        {
          "@type": "Question",
          "name": "How does Trader Journal protect my trade data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trader Journal stores all your chart screenshots directly in your own Google Drive. We never see or store your trade images on our servers. Your data stays 100% private and under your control."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Trader Journal for backtesting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Trader Journal is designed for both live trade logging and backtest documentation. You can upload backtest screenshots, record entry/exit/SL/target levels, and review all setups in our dedicated Revise mode."
          }
        },
        {
          "@type": "Question",
          "name": "Does Trader Journal calculate Risk-to-Reward automatically?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Enter your Entry Price, Stop Loss, and Target and Trader Journal instantly calculates your Risk-to-Reward ratio, points gained or lost, total PnL, and trade duration."
          }
        }
      ]
    }
    </script>
